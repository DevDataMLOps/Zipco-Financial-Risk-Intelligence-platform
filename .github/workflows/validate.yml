name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate contracts, links, inventory, and secret patterns
        run: python scripts/validate_repository.py


      - name: Test Athena evidence validation and cost modeling
        run: python -m unittest discover -s tests -p "test_athena_cost_model.py" -v
